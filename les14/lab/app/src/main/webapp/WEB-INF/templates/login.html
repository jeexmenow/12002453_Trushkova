<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
<h1>Вход в систему</h1>
<p th:if="${param.error}" style="color:red;">Неверный логин или пароль</p>
<p th:if="${param.logout}" style="color:green;">Вы вышли из системы</p>

<form th:action="@{/login}" method="post">
    <p>
        <label>Логин:</label><br>
        <input type="text" name="username" required>
    </p>
    <p>
        <label>Пароль:</label><br>
        <input type="password" name="password" required>
    </p>
    <button type="submit">Войти</button>
</form>

<p>Тестовые пользователи:</p>
<ul>
    <li><code>user / user</code> (только просмотр)</li>
    <li><code>manager / manager</code> (все операции)</li>
</ul>
</body>
</html>
