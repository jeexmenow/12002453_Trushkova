<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Заказы</title>
</head>
<body>
<h1>Список заказов</h1>
<p><a th:href="@{/orders/new}">Создать заказ</a></p>
<form th:action="@{/logout}" method="post">
    <button type="submit">Выйти</button>
</form>

<table border="1" cellpadding="6" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Клиент</th>
        <th>Дата</th>
        <th>Сумма</th>
        <th>Статус</th>
        <th>Адрес</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="o : ${orders}">
        <td th:text="${o.id()}">1</td>
        <td th:text="${o.customerName()}">Имя</td>
        <td th:text="${o.orderDate()}">Дата</td>
        <td th:text="${o.totalPrice()}">0</td>
        <td th:text="${o.status()}">NEW</td>
        <td th:text="${o.shippingAddress()}">Адрес</td>
        <td>
            <a th:href="@{/orders/{id}/edit(id=${o.id()})}">Изменить</a>
            <form th:action="@{/orders/{id}/delete(id=${o.id()})}" method="post" style="display:inline;">
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
